name: build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cycle-hardware-fidelity-audit

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: CPU core unit tests
        run: cargo test --lib cpu8080

      - name: CPU Fast-Cycle differential
        run: cargo test --test cpu8080_cycle_differential

      - name: CPU classic diagnostics quick set
        run: cargo test --test cpu8080_cycle_classic_diagnostics

      - name: CPU classic CPUTEST.COM reference run
        run: cargo test --release --test cpu8080_cycle_classic_diagnostics cycle_core_runs_cputest_with_reference_totals -- --ignored --exact

      - name: CPU classic 8080EXM.COM reference run
        run: cargo test --release --test cpu8080_cycle_classic_diagnostics cycle_core_runs_8080exm_with_reference_totals -- --ignored --exact

      - name: CPU DIP-40 pin contract
        run: cargo test --test cpu_pin_diagram

      - name: Test all targets
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Publish self-contained Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Windows
          path: target/release/rustair.exe
