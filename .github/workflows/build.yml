name: build

on:
  push:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build photographic panel assets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_blue_panel.py
      - name: Commit generated panel assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/panels/blue/panel.jpg assets/panels/blue/sprites.png
          if ! git diff --cached --quiet; then
            git commit -m "Update generated blue panel assets [skip ci]"
            git push
          fi
      - name: Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Publish Windows test build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Windows
          path: |
            target/release/rustair.exe
            assets/**
      - name: Publish Linux test build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Linux
          path: |
            target/release/rustair
            assets/**
