name: build

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Publish Windows test build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Windows
          path: |
            target/release/rustair.exe
            assets/**
      - name: Publish Linux test build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Linux
          path: |
            target/release/rustair
            assets/**
