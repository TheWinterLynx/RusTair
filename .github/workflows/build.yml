name: build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cycle-hardware-fidelity-audit

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize hardware audit cleanup
        shell: pwsh
        run: |
          python .github/scripts/finalize_hardware_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "TheWinterLynx"
          git config user.email "64207335+TheWinterLynx@users.noreply.github.com"
          git add -A
          git commit -m "Close completed hardware fidelity fixes"
          git push origin HEAD:agent/cycle-hardware-fidelity-audit
