name: build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cycle-hardware-fidelity-audit

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Canonical S-100 authority guard
        shell: pwsh
        run: |
          $legacyInte = Get-ChildItem src\machine -Recurse -Filter *.rs | Select-String -Pattern 'self\.cpu_inte|cpu_inte\s*:'
          if ($legacyInte) { $legacyInte | ForEach-Object { Write-Error $_.Line }; throw "Legacy AltairBus cpu_inte mirror remains" }

      - name: Hardware fidelity regressions
        run: cargo test --test backend_authority --test bus_teaching --test memory_wait_timing --test run_reset_timing --test cpu_pin_diagram

      - name: Test all targets
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Publish self-contained Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Windows
          path: target/release/rustair.exe
