name: build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cycle-hardware-fidelity-audit

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-cycle-fixes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Cycle architecture cleanup
        shell: pwsh
        run: |
          if (-not (Test-Path .github/scripts/apply_cycle_architecture_cleanup.py)) { Write-Host "Cleanup already applied"; exit 0 }
          python .github/scripts/apply_cycle_architecture_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "TheWinterLynx"
          git config user.email "64207335+TheWinterLynx@users.noreply.github.com"
          git add -A
          git commit -m "Propagate Cycle faults and preserve RAM reconfiguration state"
          git push origin HEAD:agent/cycle-hardware-fidelity-audit
