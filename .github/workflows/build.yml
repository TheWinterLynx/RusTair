name: build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cycle-hardware-fidelity-audit

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Publish self-contained Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Windows
          path: target/release/rustair.exe
