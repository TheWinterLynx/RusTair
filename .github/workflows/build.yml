name: build

on:
  push:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate clean panel assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'panel_clean_00.b64': (6000, '36bf91511f0db796b2edc939dd0ab9df6841c730486c072c73e05b2742838ce8'),
              'panel_clean_01a.b64': (3000, 'ac050457ce26a61112a4fb27e90cbc0bbcf5f78a516a2188f740b641fef65c99'),
              'panel_clean_01b.b64': (3000, '0de685086378720693b16bd09eb874d09bcfffc3b165d16c342e23af80bcb94b'),
              'panel_clean_02.b64': (6000, 'e0920de66262f4ac93d95b8048ec54c33cd2de737e05ecd41e75b09221152e92'),
              'panel_clean_03.b64': (6000, '9e40d0a86011102256b47ac22a88e90d9b796818f5b249786eec9eba603d6125'),
              'panel_clean_04.b64': (5244, '8699bedd9e8461aff6054a37a0174a4c6224b94831a764351a32bb4603198f41'),
              'sprites_realistic_00.b64': (5000, 'ebd1a998f547bd148ae6ade23ad9c83a82fece9fe111020c236db8a0f96be3cd'),
              'sprites_realistic_01.b64': (5000, '18f2d2cee3965f2d4f5804f760de372b4db5f07d02e2390cb823948ed3c46df1'),
              'sprites_realistic_02.b64': (5000, '26a384e6e07f87a2d8c136516050e370731d4a92775acbdd4ce816757df80098'),
              'sprites_realistic_03.b64': (5000, 'd0e6278097fb3c97b74895427c8578f502e199938d0b12cebbb8e28d8d26eaaf'),
              'sprites_realistic_04.b64': (5000, '6801a44bc8c3563b27522f294adaf61dd69a166474194a77e5a7cc4e7df6efa3'),
              'sprites_realistic_05.b64': (4680, '7343466180d22fadf000b2b8443588e9a0d4605067ab470d603a9bb2430380bc'),
          }
          root = Path('assets/panels/blue/source')
          bad = False
          for name, (want_len, want_sha) in expected.items():
              data = (root/name).read_bytes()
              got = hashlib.sha256(data).hexdigest()
              ok = len(data) == want_len and got == want_sha
              print(f'{name}: {len(data)} bytes sha256={got} {"OK" if ok else "MISMATCH"}')
              bad |= not ok
          if bad:
              raise SystemExit('Panel asset source chunk validation failed')
          PY
          python scripts/build_blue_panel.py
      - name: Commit generated runtime panel assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/panels/blue/panel.jpg assets/panels/blue/sprites.png
          if ! git diff --cached --quiet; then
            git commit -m "Update generated panel assets [skip ci]"
            git push
          fi
      - name: Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Publish Windows test build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Windows
          path: |
            target/release/rustair.exe
            assets/**
      - name: Publish Linux test build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RusTair-Linux
          path: |
            target/release/rustair
            assets/**
