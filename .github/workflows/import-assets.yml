name: import-original-runtime-assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether runtime assets are missing
        id: check
        shell: bash
        run: |
          required=(
            "4kbas32.bin"
            "asr33 body.jpg"
            "asr33 keys.png"
            "asr33head.png"
            "asrlinelocal.png"
            "asrlinelocalknob.png"
            "bellpadded.mp3"
            "click.mp3"
            "crpadded.mp3"
            "fan.mp3"
            "powerbtn.mp3"
            "printcharpadded.mp3"
            "up-hum4.mp3"
            "teletype.ttf"
          )

          needed=false
          for file in "${required[@]}"; do
            if [[ ! -f "assets/$file" ]]; then
              needed=true
              break
            fi
          done
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Download missing original runtime assets
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base='https://s2js.com/altair'

          fetch() {
            local remote="$1"
            local localname="$2"
            if [[ ! -f "assets/$localname" ]]; then
              curl --fail --location --retry 3 "$base/$remote" --output "assets/$localname"
            fi
          }

          fetch '4kbas32.bin' '4kbas32.bin'
          fetch 'asr33%20body.jpg' 'asr33 body.jpg'
          fetch 'asr33%20keys.png' 'asr33 keys.png'
          fetch 'asr33head.png' 'asr33head.png'
          fetch 'asrlinelocal.png' 'asrlinelocal.png'
          fetch 'asrlinelocalknob.png' 'asrlinelocalknob.png'
          fetch 'bellpadded.mp3' 'bellpadded.mp3'
          fetch 'click.mp3' 'click.mp3'
          fetch 'crpadded.mp3' 'crpadded.mp3'
          fetch 'fan.mp3' 'fan.mp3'
          fetch 'powerbtn.mp3' 'powerbtn.mp3'
          fetch 'printcharpadded.mp3' 'printcharpadded.mp3'
          fetch 'up-hum4.mp3' 'up-hum4.mp3'
          fetch 'teletype.ttf' 'teletype.ttf'

      - name: Commit imported runtime assets
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add missing original runtime assets'
          git push
